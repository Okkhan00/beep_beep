name: Android Build

# Standalone CI: builds the debug APK with the committed Gradle wrapper,
# runs unit tests and lint, and uploads the APK as a workflow artifact.
# No secrets are required. Release signing is NOT done here (see KEYSTORE_SETUP.md).

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: ./.github/actions/setup-android-sdk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleStandardDebug --stacktrace 2>&1 | tee build.log

      - name: Surface build errors as annotation
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          lines = open("build.log", errors="replace").read().splitlines()
          keep = []
          for i, l in enumerate(lines):
              if l.startswith("e: ") or "error:" in l or "FAILURE:" in l or "What went wrong" in l or "Execution failed" in l or "Could not " in l:
                  keep.extend(lines[i:i+4])
          seen, out = set(), []
          for l in keep:
              if l not in seen:
                  seen.add(l); out.append(l)
          msg = "\n".join(out)[:55000] or "\n".join(lines[-80:])
          msg = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Build errors::" + msg)
          PY

      - name: Locate APK
        id: apk
        run: |
          APK_DIR="app/build/outputs/apk/standard/debug"
          ls -la "$APK_DIR"
          APK=$(find "$APK_DIR" -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "::error::No APK found in $APK_DIR"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "### Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$APK\` ($(du -h "$APK" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect APK contents (native libs, permissions)
        run: |
          APK=$(ls app/build/outputs/apk/standard/debug/*.apk | head -n1)
          echo "### APK native libraries" >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$APK" | grep -E "lib/.*(ffmpeg|python|qjs|c\+\+)" | tee -a "$GITHUB_STEP_SUMMARY" || echo "no matching native libs found"
          echo "### ABI folders" >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$APK" | grep -oE "lib/[^/]+/" | sort -u | tee -a "$GITHUB_STEP_SUMMARY"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "### Declared permissions" >> "$GITHUB_STEP_SUMMARY"
          "$BT/aapt2" dump permissions "$APK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: media-downloader-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        id: unit
        continue-on-error: true
        run: ./gradlew :app:testStandardDebugUnitTest --stacktrace

      - name: Run lint
        id: lint
        continue-on-error: true
        run: ./gradlew :app:lintStandardDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Report test and lint status
        if: always()
        run: |
          {
            echo "### Results"
            echo "- Unit tests: ${{ steps.unit.outcome }}"
            echo "- Lint: ${{ steps.lint.outcome }} (advisory)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if unit tests failed
        if: steps.unit.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed. The APK was still built and uploaded; see the 'reports' artifact."
          exit 1
